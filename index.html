    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body {
      margin: 0; padding: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at top, #2b2b52, #0b0b1a);
      color: #f9f9ff;
    }
    .container {
      width: 100%; max-width: 520px; max-height: 95vh;
      padding: 20px;
      background: rgba(10,10,25,0.9); border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      overflow-y: auto;
    }
    h1 { text-align:center; margin:0 0 4px; }
    h3 { margin-top: 0; }
    #subtitle { text-align:center; font-size:0.8rem; opacity:0.8; margin-bottom:8px; }
    button {
      width: 100%; padding: 10px; border-radius: 12px;
      border: none; margin-top: 10px; font-weight:600;
      background: linear-gradient(130deg,#ff7fd1,#7f7fff); cursor:pointer;
      color:#0b0b1a;
      transition: 0.15s;
    }
    button:hover { opacity:.92; transform:translateY(-1px); }
    .choice-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff; margin: 6px 0;
      width: 100%; padding: 10px; border-radius:10px;
      cursor:pointer;
      transition:0.15s;
    }
    .choice-btn.selected {
      background: rgba(255,127,209,0.3); border-color:#ff7fd1;
    }
    input[type="number"], input[type="text"] {
      width: 100%; padding: 8px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1); color: #fff;
      margin-top: 8px;
    }
    input[type="checkbox"] { transform: scale(1.3); margin-right: 8px; }
    label { font-size: 0.95rem; }
    .word-box {
      text-align:center; background:rgba(255,255,255,0.08);
      padding:12px; border-radius:10px; margin-top:10px;
    }
    .vote-grid {
      display:grid; grid-template-columns:repeat(auto-fit,minmax(80px,1fr)); gap:10px;
    }
    .vote-btn {
      padding:10px; border-radius:10px; background:rgba(255,255,255,0.1);
      border:1px solid rgba(255,255,255,0.2); cursor:pointer; color:#fff;
      transition:0.1s;
    }
    .vote-btn.selected { background:rgba(255,127,209,0.3); border-color:#ff7fd1; }
    .center { text-align:center; }
    .small { font-size: 0.85rem; opacity: 0.85; }
    .name-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .pill {
      display:inline-block; padding:4px 10px; border-radius:999px;
      background:rgba(255,255,255,0.08); font-size:0.8rem; margin:2px;
    }

  /* One-word hint generator (simple & vague) */
  function getHintForWord(word, mode) {
    const w = word.toLowerCase();

    // Title-based hints (setting / vibe)
    const titleHints = {

      "bleach": ["afterlife","swords","spirits","city"],

    const locationHints = {
      "konoha": ["village","trees","walls","cliff"],
      "soul society": ["afterlife","swords","court","gates"],
      "grand line": ["sea","islands","storms","crew"],

      "greed island": ["island","game","forest","adventure"],
      "fairy tail guild": ["guild","hall","bar","jobs"],

      "infinity castle": ["castle","floating","maze","dim"],
      "liones": ["castle","kingdom","town","banners"],

      "camelot": ["castle","knights","walls","tournament"],

      "morioh": ["town","coast","suburb","park"],
      "dio's mansion": ["mansion","gothic","stairs","dark"]
    };

    if (mode === "titles") {
      const k = w;
      const lst = titleHints[k];
      if (lst) return lst[Math.floor(Math.random() * lst.length)];
      const fallback = ["city","adventure","school","sea","forest","castle","space","train","modern","walls"];
      return fallback[Math.floor(Math.random() * fallback.length)];
    }

    if (mode === "locations") {
      const k = w;
      const lst = locationHints[k];
      if (lst) return lst[Math.floor(Math.random() * lst.length)];
      const fallback = ["village","city","walls","sea","forest","castle","fields","station","harbor","island"];
      return fallback[Math.floor(Math.random() * fallback.length)];
    }

    // characters: vague appearance / personality
    const charFallback = ["hair","eyes","coat","scarf","mask","calm","loud","serious","cheerful","quiet"];
    return charFallback[Math.floor(Math.random() * charFallback.length)];
  }

  function randomRoomCode(length = 5) {
    const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
    let out = "";
    for (let i = 0; i < length; i++) {
      out += letters[Math.floor(Math.random() * letters.length)];
    }
    return out;
  }

  function randomItem(arr) {

  // Converts a players map into a sortable array for display
  function getPlayersArray(playersMap) {
    if (!playersMap) return [];
    return Object.values(playersMap).sort((a, b) => a.name.localeCompare(b.name));
  }
  
  // Converts a word to its displayed form (Title Mode)
  function getDisplayWord(secretWord, guessedLetters) {
      // Use .toUpperCase() for matching logic simplicity
      const upperWord = secretWord.toUpperCase(); 
      let display = upperWord.split('').map(char => {
          if (char === ' ' || char === '\'' || char === '-' || char === ':' || char === '(' || char === ')') return char;
          return guessedLetters.includes(char) ? char : '_';
      }).join(' ');
      return display;
  }

  // Simple function to see if the word is fully guessed (only used to auto-win if all letters are revealed)
  function isWordGuessed(secretWord, guessedLetters) {
      const upperWord = secretWord.toUpperCase();
      return upperWord.split('').every(char => 
          char === ' ' || char === '\'' || char === '-' || char === ':' || char === '(' || char === ')' || guessedLetters.includes(char)
      );
  }
